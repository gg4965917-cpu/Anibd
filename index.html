<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anime Hub — аніме українською</title>
  <meta name="description" content="Anime Hub — аніме українською. Вбудований HLS-плеєр, трейлери з MAL, релізи від Amanogawa та інших українських студій." />
  <link rel="preconnect" href="https://api.jikan.moe" />
  <link rel="preconnect" href="https://api.anilibria.tv" />
  <link rel="preconnect" href="https://cache.libria.fun" crossorigin />
  <link rel="icon" href="./assets/logo.png" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <a class="logo" href="#/" aria-label="Anime Hub">
        <img class="logo-img" src="./assets/logo.png" alt="Anime Hub" width="44" height="44" />
        <span class="logo-text">Anime<span class="logo-sub">Hub</span></span>
      </a>

      <form id="search-form" class="search" role="search">
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Пошук аніме (назва англійською чи японською)…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Пошук аніме" />
        <button type="submit" aria-label="Шукати">Шукати</button>
      </form>

      <nav class="primary-nav">
        <a href="#/" data-route="home">Головна</a>
        <a href="#/top" data-route="top">Топ</a>
        <a href="#/season" data-route="season">Сезон</a>
        <a href="#/studios" data-route="studios">Студії</a>
        <button id="settings-btn" class="link-btn" type="button" aria-haspopup="dialog">Налаштування</button>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <footer class="app-footer">
    <div class="wrap">
      <p>
        Джерела: <a href="https://shikimori.one" target="_blank" rel="noopener">Shikimori</a> ·
        <a href="https://myanimelist.net" target="_blank" rel="noopener">MyAnimeList</a> (Jikan) ·
        <a href="https://kodik.info" target="_blank" rel="noopener">Kodik</a> ·
        <a href="https://amanogawa.space" target="_blank" rel="noopener">Amanogawa</a>.
      </p>
      <p class="muted">
        Anibd — агрегатор. Всі права на аніме та дубляж належать відповідним правовласникам.
      </p>
    </div>
  </footer>

  <!-- Player modal -->
  <dialog id="player-dialog" class="player-dialog" aria-label="Плеєр">
    <div class="player-dialog__head">
      <div class="player-dialog__title">
        <h2 id="player-title">—</h2>
        <p id="player-subtitle" class="muted"></p>
      </div>
      <div class="player-controls">
        <button id="player-open-new" type="button" class="link-btn">↗ Новa вкладка</button>
        <button id="player-close" type="button" class="close-btn" aria-label="Закрити">✕</button>
      </div>
    </div>

    <div class="player-tabs" role="tablist" aria-label="Джерело плеєра">
      <button class="player-tab is-active" role="tab" data-source="hls" aria-selected="true">
        <span class="player-tab__dot player-tab__dot--live"></span>Онлайн (HLS)
      </button>
      <button class="player-tab" role="tab" data-source="trailer">
        <span class="player-tab__dot"></span>Трейлер
      </button>
      <button class="player-tab" role="tab" data-source="kodik-ua">
        <span class="player-tab__dot player-tab__dot--ua"></span>Kodik · UA-дубляж
      </button>
      <button class="player-tab" role="tab" data-source="kodik">
        <span class="player-tab__dot"></span>Kodik · усі озвучки
      </button>
      <button class="player-tab" role="tab" data-source="amanogawa">Amanogawa</button>
      <button class="player-tab" role="tab" data-source="anitube">AniTube</button>
      <button class="player-tab" role="tab" data-source="anihub">AniHub</button>
      <button class="player-tab" role="tab" data-source="newcomers">NewComers</button>
      <button class="player-tab" role="tab" data-source="fanvoxua">FanVoxUA</button>
      <button class="player-tab" role="tab" data-source="uakino">Uakino</button>
    </div>

    <div id="player-mount" class="player-mount">
      <div class="player-placeholder">Завантаження плеєра…</div>
    </div>
  </dialog>

  <!-- Settings modal -->
  <dialog id="settings-dialog" class="settings-dialog" aria-label="Налаштування">
    <form method="dialog" id="settings-form">
      <h2>Налаштування джерел</h2>
      <p class="muted">
        Усі ключі зберігаються лише у цьому браузері (localStorage).
      </p>

      <label class="field">
        <span>Kodik API токен (необовʼязково)</span>
        <input type="text" id="settings-kodik-token" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" />
        <small class="muted">
          Без токена плеєр працює через публічний <code>find-player</code> ендпоінт Kodik.
          Токен вмикає пошук українських озвучок через API Kodik.
          Отримати можна на <a href="https://kodikapi.com" target="_blank" rel="noopener">kodikapi.com</a>.
        </small>
      </label>

      <label class="field">
        <span>Тільки український дубляж у плеєрі за замовчуванням</span>
        <input type="checkbox" id="settings-ua-only" />
      </label>

      <label class="field">
        <span>Shikimori User-Agent (для API пошуку, опц.)</span>
        <input type="text" id="settings-shiki-ua" placeholder="Anibd/1.0 (контактний email)" autocomplete="off" />
      </label>

      <div class="settings-actions">
        <button type="submit" value="save" class="primary">Зберегти</button>
        <button type="button" id="settings-close" class="secondary">Скасувати</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
